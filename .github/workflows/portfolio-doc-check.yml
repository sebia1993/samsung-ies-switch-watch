name: Portfolio documentation check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-doc-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-wpf-screens:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Restore manual capture tool
        shell: powershell
        run: dotnet restore .\tools\SamsungSwitchWatch.ManualCapture\SamsungSwitchWatch.ManualCapture.csproj --locked-mode

      - name: Render actual WPF screens with demo data
        shell: powershell
        run: |
          dotnet run --project .\tools\SamsungSwitchWatch.ManualCapture\SamsungSwitchWatch.ManualCapture.csproj -c Release --no-restore -- .\artifacts\portfolio-screens
          if (-not (Test-Path .\artifacts\portfolio-screens\01-dashboard.png)) { throw 'dashboard screenshot missing' }
          if (-not (Test-Path .\artifacts\portfolio-screens\04-command-output.png)) { throw 'command output screenshot missing' }
          $dashboard = Get-Item .\artifacts\portfolio-screens\01-dashboard.png
          $command = Get-Item .\artifacts\portfolio-screens\04-command-output.png
          if ($dashboard.Length -lt 10000) { throw 'dashboard screenshot is unexpectedly small' }
          if ($command.Length -lt 10000) { throw 'command screenshot is unexpectedly small' }

      - name: Stage selected documentation screens
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\portfolio-selected | Out-Null
          Copy-Item .\artifacts\portfolio-screens\01-dashboard.png .\artifacts\portfolio-selected\dashboard.png
          Copy-Item .\artifacts\portfolio-screens\04-command-output.png .\artifacts\portfolio-selected\command-output.png

      - name: Upload documentation screens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samsung-switch-watch-doc-screens-${{ github.run_id }}
          path: artifacts/portfolio-selected
          if-no-files-found: error
          retention-days: 14
